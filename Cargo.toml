[package]
name = "nestor-satellite"
version = "0.6.0"
edition = "2024"
rust-version = "1.91"
description = "Rust SDK to write Nestor satellite drivers: pairing, the WebSocket link, text, and WebRTC audio as a feature."
license = "MIT"
authors = ["Mathis Lambert"]
repository = "https://github.com/nestor-home/nestor-satellite-rust"
homepage = "https://nestorhome.dev"
readme = "README.md"
keywords = ["nestor", "satellite", "voice-assistant", "websocket", "robotics"]
categories = ["multimedia::audio", "network-programming"]
include = ["src/**", "schemas/*.json", "voice/**", "README.md", "LICENSE"]

[lib]
name = "nestor_satellite"

[[bin]]
name = "nestor-satellite"
path = "src/bin/nestor-satellite.rs"
required-features = ["cli"]

[features]
default = []
# Talking aloud: WebRTC audio (Opus) with your own AudioSource/AudioSink, and the device code said with
# the bundled voice. Without it, a satellite pairs, holds its link, carries out intents and talks in writing.
voice = ["dep:bytes", "dep:opus", "dep:rtc", "dep:webrtc"]
# The machine's microphone and speaker through cpal.
audio = ["voice", "dep:cpal"]
# The `nestor-satellite` command: a microphone + speaker satellite, or a text one in the terminal.
cli = ["audio", "dep:clap", "dep:gethostname", "dep:tracing-subscriber"]

[dependencies]
async-trait = "0.1.92"
bytes = { version = "1.12.1", optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
fluent-bundle = "0.16.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
opus = { version = "0.4.0", optional = true }
reqwest = { version = "0.13.0", default-features = false, features = ["json", "rustls-no-provider"] }
rtc = { version = "0.21.1", default-features = false, optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1.44"
unic-langid = "0.9.6"
uuid = { version = "1.29.0", features = ["v4"] }
webrtc = { version = "0.21.1", optional = true }

cpal = { version = "0.18.2", optional = true }
clap = { version = "4.6.7", features = ["derive", "env"], optional = true }
gethostname = { version = "1.1.0", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"], optional = true }
ring = "0.17.14"

[dev-dependencies]
axum = { version = "0.8.9", features = ["ws"] }
jsonschema = { version = "0.61.0", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util", "macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[[example]]
name = "led"
required-features = ["audio"]

[[example]]
name = "screen"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
