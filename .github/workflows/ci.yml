name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: advisories are published without any change here

env:
  CARGO_TERM_COLOR: always
  # No debug info: a smaller target to cache and restore, and faster links.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ALSA for cpal (feature `audio`), restored from the cache rather than through apt and dpkg;
      # libopus is built from source with cmake (preinstalled).
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      # Without `voice`: pairing, the link and text, and no WebRTC nor Opus in the build.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: if cargo tree -e normal -i webrtc; then echo "webrtc is built without the voice feature"; exit 1; fi

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --all-features

  conformance:
    # The published server's black-box suite (`nestor satellites conformance`, version in
    # .nestor-version) against the binary, as a speaker, as a camera and as a text satellite. The
    # three runs mostly wait on the suite's timers, so they run side by side.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          cache-dependency-glob: .nestor-version
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --test conformance -- --nocapture
        env:
          NESTOR_CONFORMANCE: required

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  # The single check the branch rules require.
  ci:
    needs: [check, msrv, conformance, audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
