name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ALSA for cpal (feature `audio`); libopus is built from source with cmake (preinstalled).
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --all-features

  conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nestor-satellite-rust
    steps:
      - uses: actions/checkout@v7
        with:
          path: nestor-satellite-rust
      # The server, at ../nestor: its black-box conformance suite, run against the binary.
      - uses: actions/checkout@v7
        with:
          repository: nestor-home/nestor
          path: nestor
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra voice
        working-directory: nestor
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nestor-satellite-rust
      - run: cargo test --all-features --test conformance --test schemas -- --nocapture
        env:
          NESTOR_CONFORMANCE: required

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
